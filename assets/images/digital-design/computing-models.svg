<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" role="img" aria-labelledby="title description">
  <title id="title">Stored-program and spatially configured computing models</title>
  <desc id="description">A Turing machine motivates the stored-program von Neumann computer, while a cellular automaton motivates the grid of configurable logic and routing in an FPGA.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; }
    .machine { fill: #ecf7f5; stroke: #0f766e; stroke-width: 4; }
    .memory { fill: #eff6ff; stroke: #2563eb; stroke-width: 4; }
    .cell { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .active { fill: #0f766e; stroke: #0f766e; stroke-width: 2; }
    .route { fill: none; stroke: #0f766e; stroke-width: 4; }
    .wire { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
    .bidirectional { fill: none; stroke: #334155; stroke-width: 4; marker-start: url(#arrow); marker-end: url(#arrow); }
    .title { fill: #111827; font: 750 29px Inter, Arial, sans-serif; text-anchor: middle; }
    .label { fill: #111827; font: 700 24px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 600 20px Inter, Arial, sans-serif; text-anchor: middle; }
    .heading { fill: #0f766e; font: 750 27px Inter, Arial, sans-serif; text-anchor: middle; }
  </style>

  <text class="small" x="360" y="35">abstract model</text>
  <text class="small" x="1040" y="35">practical programmable machine</text>

  <rect class="panel" x="25" y="55" width="1350" height="250" rx="6"/>
  <text class="title" x="355" y="95">Turing machine</text>
  <g transform="translate(180 145)">
    <rect class="cell" x="0" y="0" width="55" height="55"/><rect class="cell" x="55" y="0" width="55" height="55"/>
    <rect class="active" x="110" y="0" width="55" height="55"/><rect class="cell" x="165" y="0" width="55" height="55"/>
    <rect class="cell" x="220" y="0" width="55" height="55"/><rect class="cell" x="275" y="0" width="55" height="55"/>
    <rect class="machine" x="105" y="82" width="165" height="70" rx="5"/>
    <text class="label" x="187" y="125">controller</text>
    <path class="wire" d="M187 82 V61"/>
  </g>

  <line class="wire" x1="555" y1="180" x2="685" y2="180"/>

  <text class="title" x="1030" y="95">von Neumann computer</text>
  <rect class="machine" x="785" y="135" width="235" height="115" rx="5"/>
  <text class="label" x="902" y="188">processor</text>
  <text class="small" x="902" y="222">fixed datapath</text>
  <rect class="memory" x="1110" y="135" width="215" height="115" rx="5"/>
  <text class="label" x="1217" y="188">memory</text>
  <text class="small" x="1217" y="222">code + data</text>
  <path class="bidirectional" d="M1028 192 H1102"/>

  <rect class="panel" x="25" y="335" width="1350" height="275" rx="6"/>
  <text class="title" x="355" y="375">cellular automaton</text>
  <g transform="translate(225 405)">
    <rect class="cell" x="0" y="0" width="44" height="44"/><rect class="cell" x="44" y="0" width="44" height="44"/><rect class="cell" x="88" y="0" width="44" height="44"/><rect class="cell" x="132" y="0" width="44" height="44"/><rect class="cell" x="176" y="0" width="44" height="44"/><rect class="cell" x="220" y="0" width="44" height="44"/>
    <rect class="cell" x="0" y="44" width="44" height="44"/><rect class="cell" x="44" y="44" width="44" height="44"/><rect class="active" x="88" y="44" width="44" height="44"/><rect class="cell" x="132" y="44" width="44" height="44"/><rect class="cell" x="176" y="44" width="44" height="44"/><rect class="cell" x="220" y="44" width="44" height="44"/>
    <rect class="cell" x="0" y="88" width="44" height="44"/><rect class="cell" x="44" y="88" width="44" height="44"/><rect class="active" x="88" y="88" width="44" height="44"/><rect class="active" x="132" y="88" width="44" height="44"/><rect class="cell" x="176" y="88" width="44" height="44"/><rect class="cell" x="220" y="88" width="44" height="44"/>
    <rect class="cell" x="0" y="132" width="44" height="44"/><rect class="cell" x="44" y="132" width="44" height="44"/><rect class="active" x="88" y="132" width="44" height="44"/><rect class="cell" x="132" y="132" width="44" height="44"/><rect class="cell" x="176" y="132" width="44" height="44"/><rect class="cell" x="220" y="132" width="44" height="44"/>
  </g>

  <line class="wire" x1="555" y1="470" x2="685" y2="470"/>

  <text class="title" x="1030" y="375">field-programmable gate array</text>
  <g transform="translate(815 385)">
    <path class="route" d="M0 46 H420 M0 118 H420 M0 190 H420 M58 0 V220 M150 0 V220 M242 0 V220 M334 0 V220"/>
    <rect class="machine" x="24" y="15" width="68" height="62" rx="4"/><rect class="machine" x="116" y="15" width="68" height="62" rx="4"/><rect class="machine" x="208" y="15" width="68" height="62" rx="4"/><rect class="machine" x="300" y="15" width="68" height="62" rx="4"/>
    <rect class="machine" x="24" y="87" width="68" height="62" rx="4"/><rect class="machine" x="116" y="87" width="68" height="62" rx="4"/><rect class="machine" x="208" y="87" width="68" height="62" rx="4"/><rect class="machine" x="300" y="87" width="68" height="62" rx="4"/>
    <rect class="machine" x="24" y="159" width="68" height="62" rx="4"/><rect class="machine" x="116" y="159" width="68" height="62" rx="4"/><rect class="machine" x="208" y="159" width="68" height="62" rx="4"/><rect class="machine" x="300" y="159" width="68" height="62" rx="4"/>
    <text class="small" x="58" y="55">LUT</text><text class="small" x="150" y="127">LUT</text><text class="small" x="242" y="199">LUT</text>
  </g>
</svg>
