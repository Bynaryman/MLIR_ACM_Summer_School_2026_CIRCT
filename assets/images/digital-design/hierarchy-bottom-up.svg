<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
  <title id="title">Building a processing element from reusable hardware modules</title>
  <desc id="description">A multiplier module is instantiated inside a multiply-accumulate module, which is instantiated inside a processing element.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; }
    .module { fill: #ecf7f5; stroke: #0f766e; stroke-width: 5; }
    .nested { fill: #ffffff; stroke: #0f766e; stroke-width: 4; }
    .wire { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: #b45309; stroke-width: 4; marker-end: url(#arrow); }
    .title { fill: #111827; font: 750 33px Inter, Arial, sans-serif; text-anchor: middle; }
    .label { fill: #111827; font: 700 27px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 600 22px Inter, Arial, sans-serif; text-anchor: middle; }
    .port { fill: #334155; font: 650 22px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .accent { fill: #0f766e; font: 750 25px Inter, Arial, sans-serif; text-anchor: middle; }
  </style>

  <rect class="panel" x="25" y="55" width="360" height="410" rx="6"/>
  <text class="title" x="205" y="100">1. multiplier</text>
  <rect class="module" x="105" y="160" width="200" height="185" rx="6"/>
  <text class="label" x="205" y="220">mul4</text>
  <circle class="nested" cx="205" cy="285" r="40"/>
  <text class="label" x="205" y="296">*</text>
  <text class="port" x="57" y="235">a</text>
  <text class="port" x="57" y="305">b</text>
  <line class="wire" x1="75" y1="228" x2="101" y2="228"/>
  <line class="wire" x1="75" y1="298" x2="101" y2="298"/>
  <line class="wire" x1="305" y1="260" x2="345" y2="260"/>
  <text class="small" x="205" y="408">one reusable module</text>

  <line class="wire" x1="398" y1="260" x2="447" y2="260"/>

  <rect class="panel" x="455" y="55" width="430" height="410" rx="6"/>
  <text class="title" x="670" y="100">2. multiply-accumulate</text>
  <rect class="module" x="505" y="145" width="330" height="235" rx="6"/>
  <text class="label" x="670" y="185">mac4</text>
  <rect class="nested" x="540" y="220" width="110" height="80" rx="5"/>
  <text class="label" x="595" y="270">mul4</text>
  <circle class="nested" cx="730" cy="260" r="38"/>
  <text class="label" x="730" y="270">+</text>
  <rect class="nested" x="775" y="315" width="45" height="38" rx="4"/>
  <text class="small" x="797" y="342">R</text>
  <line class="wire" x1="650" y1="260" x2="684" y2="260"/>
  <line class="wire" x1="768" y1="260" x2="807" y2="260"/>
  <path class="feedback" d="M797 315 V205 H730 V216"/>
  <text class="small" x="670" y="424">the instance becomes part of this circuit</text>

  <line class="wire" x1="897" y1="260" x2="947" y2="260"/>

  <rect class="panel" x="955" y="55" width="420" height="410" rx="6"/>
  <text class="title" x="1165" y="100">3. processing element</text>
  <rect class="module" x="1030" y="145" width="270" height="235" rx="6"/>
  <text class="label" x="1165" y="188">PE</text>
  <rect class="nested" x="1090" y="220" width="150" height="92" rx="5"/>
  <text class="label" x="1165" y="276">mac4</text>
  <line class="wire" x1="980" y1="250" x2="1026" y2="250"/>
  <line class="wire" x1="1165" y1="115" x2="1165" y2="141"/>
  <line class="wire" x1="1300" y1="250" x2="1342" y2="250"/>
  <line class="wire" x1="1165" y1="380" x2="1165" y2="425"/>
  <text class="small" x="1165" y="449">ports expose only the useful boundary</text>
</svg>
