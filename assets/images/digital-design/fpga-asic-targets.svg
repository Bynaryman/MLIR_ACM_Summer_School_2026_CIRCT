<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
  <title id="title">The same hardware description targeting FPGA and ASIC</title>
  <desc id="description">SystemVerilog can be synthesized for an FPGA as LUT contents, hard blocks, and routing configuration, or for an ASIC as standard cells and fixed metal wires.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .source { fill: #ffffff; stroke: #334155; stroke-width: 4; }
    .fpga { fill: #ecf7f5; stroke: #0f766e; stroke-width: 4; }
    .asic { fill: #fff7ed; stroke: #b45309; stroke-width: 4; }
    .wire { fill: none; stroke: #334155; stroke-width: 5; marker-end: url(#arrow); }
    .label { fill: #111827; font: 750 29px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 600 22px Inter, Arial, sans-serif; text-anchor: middle; }
    .mono { fill: #111827; font: 700 25px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .fpgaText { fill: #0f766e; font: 750 25px Inter, Arial, sans-serif; text-anchor: middle; }
    .asicText { fill: #b45309; font: 750 25px Inter, Arial, sans-serif; text-anchor: middle; }
  </style>

  <rect class="source" x="35" y="125" width="350" height="270" rx="6"/>
  <text class="label" x="210" y="180">SystemVerilog</text>
  <text class="mono" x="210" y="245">assign y = a | b;</text>
  <text class="small" x="210" y="315">behavior + structure</text>
  <text class="small" x="210" y="350">with explicit widths and clocks</text>

  <path class="wire" d="M385 220 H505 V140 H610"/>
  <path class="wire" d="M385 300 H505 V380 H610"/>
  <text class="small" x="500" y="198">synthesis</text>

  <rect class="fpga" x="620" y="45" width="735" height="195" rx="6"/>
  <text class="fpgaText" x="770" y="88">FPGA target</text>
  <text class="label" x="845" y="145">LUT + DSP + routing</text>
  <path class="wire" d="M1050 142 H1160"/>
  <text class="label" x="1250" y="145">bitstream</text>
  <text class="small" x="990" y="205">manufactured fabric, reconfigured after deployment</text>

  <rect class="asic" x="620" y="280" width="735" height="195" rx="6"/>
  <text class="asicText" x="770" y="323">ASIC target</text>
  <text class="label" x="845" y="380">standard cells + metal</text>
  <path class="wire" d="M1050 377 H1160"/>
  <text class="label" x="1250" y="380">GDSII</text>
  <text class="small" x="990" y="440">no generic LUT fabric; fabrication fixes the circuit</text>
</svg>
