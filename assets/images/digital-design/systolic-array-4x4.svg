<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Four by four systolic array</title>
  <desc id="description">Sixteen processing elements form a grid. Values A flow horizontally and values B flow vertically through the processing elements.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .pe { fill: #ecf7f5; stroke: #0f766e; stroke-width: 4; }
    .wire-a { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow); }
    .wire-b { fill: none; stroke: #b45309; stroke-width: 4; marker-end: url(#arrow); }
    .label { fill: #111827; font: 750 24px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 650 20px Inter, Arial, sans-serif; text-anchor: middle; }
    .axis-a { fill: #2563eb; font: 750 26px Inter, Arial, sans-serif; }
    .axis-b { fill: #b45309; font: 750 26px Inter, Arial, sans-serif; text-anchor: middle; }
    .caption { fill: #0f766e; font: 750 30px Inter, Arial, sans-serif; text-anchor: middle; }
  </style>

  <text class="axis-a" x="30" y="335">A flows right</text>
  <text class="axis-b" x="645" y="34">B flows down</text>

  <!-- Horizontal data paths. -->
  <path class="wire-a" d="M165 125 H1085"/>
  <path class="wire-a" d="M165 255 H1085"/>
  <path class="wire-a" d="M165 385 H1085"/>
  <path class="wire-a" d="M165 515 H1085"/>

  <!-- Vertical data paths. -->
  <path class="wire-b" d="M330 55 V590"/>
  <path class="wire-b" d="M540 55 V590"/>
  <path class="wire-b" d="M750 55 V590"/>
  <path class="wire-b" d="M960 55 V590"/>

  <!-- Processing elements. -->
  <g>
    <rect class="pe" x="275" y="80" width="110" height="90" rx="5"/><text class="label" x="330" y="120">PE</text><text class="small" x="330" y="148">mul + add</text>
    <rect class="pe" x="485" y="80" width="110" height="90" rx="5"/><text class="label" x="540" y="120">PE</text><text class="small" x="540" y="148">mul + add</text>
    <rect class="pe" x="695" y="80" width="110" height="90" rx="5"/><text class="label" x="750" y="120">PE</text><text class="small" x="750" y="148">mul + add</text>
    <rect class="pe" x="905" y="80" width="110" height="90" rx="5"/><text class="label" x="960" y="120">PE</text><text class="small" x="960" y="148">mul + add</text>

    <rect class="pe" x="275" y="210" width="110" height="90" rx="5"/><text class="label" x="330" y="250">PE</text><text class="small" x="330" y="278">mul + add</text>
    <rect class="pe" x="485" y="210" width="110" height="90" rx="5"/><text class="label" x="540" y="250">PE</text><text class="small" x="540" y="278">mul + add</text>
    <rect class="pe" x="695" y="210" width="110" height="90" rx="5"/><text class="label" x="750" y="250">PE</text><text class="small" x="750" y="278">mul + add</text>
    <rect class="pe" x="905" y="210" width="110" height="90" rx="5"/><text class="label" x="960" y="250">PE</text><text class="small" x="960" y="278">mul + add</text>

    <rect class="pe" x="275" y="340" width="110" height="90" rx="5"/><text class="label" x="330" y="380">PE</text><text class="small" x="330" y="408">mul + add</text>
    <rect class="pe" x="485" y="340" width="110" height="90" rx="5"/><text class="label" x="540" y="380">PE</text><text class="small" x="540" y="408">mul + add</text>
    <rect class="pe" x="695" y="340" width="110" height="90" rx="5"/><text class="label" x="750" y="380">PE</text><text class="small" x="750" y="408">mul + add</text>
    <rect class="pe" x="905" y="340" width="110" height="90" rx="5"/><text class="label" x="960" y="380">PE</text><text class="small" x="960" y="408">mul + add</text>

    <rect class="pe" x="275" y="470" width="110" height="90" rx="5"/><text class="label" x="330" y="510">PE</text><text class="small" x="330" y="538">mul + add</text>
    <rect class="pe" x="485" y="470" width="110" height="90" rx="5"/><text class="label" x="540" y="510">PE</text><text class="small" x="540" y="538">mul + add</text>
    <rect class="pe" x="695" y="470" width="110" height="90" rx="5"/><text class="label" x="750" y="510">PE</text><text class="small" x="750" y="538">mul + add</text>
    <rect class="pe" x="905" y="470" width="110" height="90" rx="5"/><text class="label" x="960" y="510">PE</text><text class="small" x="960" y="538">mul + add</text>
  </g>

  <text class="caption" x="645" y="630">4 x 4 generate loops elaborate 16 concurrent PE instances</text>
</svg>
