<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Building a seven-input Boolean function from two six-input LUTs</title>
  <desc id="description">The lower six inputs drive two LUT6 blocks. The seventh input selects their outputs with a multiplexer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .lut { fill: #ecf7f5; stroke: #0f766e; stroke-width: 5; }
    .mux { fill: #fff7ed; stroke: #b45309; stroke-width: 5; }
    .wire { fill: none; stroke: #334155; stroke-width: 5; marker-end: url(#arrow); }
    .bus { fill: none; stroke: #2563eb; stroke-width: 6; }
    .select { fill: none; stroke: #b45309; stroke-width: 5; marker-end: url(#arrow); }
    .label { fill: #111827; font: 750 29px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 600 22px Inter, Arial, sans-serif; text-anchor: middle; }
    .mono { fill: #111827; font: 700 25px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .accent { fill: #0f766e; font: 750 28px Inter, Arial, sans-serif; text-anchor: middle; }
  </style>

  <text class="accent" x="600" y="40">larger functions are decomposed and connected</text>

  <text class="mono" x="85" y="230">x[5:0]</text>
  <path class="bus" d="M175 220 H320 M240 220 V125 H320 M240 220 V325 H320"/>
  <path class="wire" d="M240 125 H312"/>
  <path class="wire" d="M240 325 H312"/>

  <rect class="lut" x="325" y="75" width="280" height="135" rx="6"/>
  <text class="label" x="465" y="126">LUT6</text>
  <text class="small" x="465" y="170">f(0, x[5:0])</text>

  <rect class="lut" x="325" y="275" width="280" height="135" rx="6"/>
  <text class="label" x="465" y="326">LUT6</text>
  <text class="small" x="465" y="370">f(1, x[5:0])</text>

  <path class="wire" d="M605 142 H760 V175 H805"/>
  <path class="wire" d="M605 342 H760 V305 H805"/>

  <path class="mux" d="M810 135 L960 195 L960 285 L810 345 Z"/>
  <text class="label" x="880" y="252">MUX</text>

  <text class="mono" x="600" y="425">x[6]</text>
  <path class="select" d="M665 415 H880 V335"/>

  <path class="wire" d="M960 240 H1115"/>
  <text class="mono" x="1130" y="248">y</text>
  <text class="small" x="880" y="390">the seventh input chooses the half-table</text>
</svg>
