<svg viewBox="0 0 1500 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Normal-path E4M3 multiplier with sign, exponent, and significand lanes">
  <style>
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .input-name,
    .result-label {
      fill: #293841;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 700;
    }

    .field {
      stroke-width: 2;
    }

    .sign-field {
      fill: #f1eef5;
      stroke: #77658a;
    }

    .exp-field {
      fill: #eaf2f5;
      stroke: #477280;
    }

    .frac-field {
      fill: #eaf5f0;
      stroke: #477963;
    }

    .field-label {
      fill: #263640;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 800;
      text-anchor: middle;
    }

    .lane-label {
      fill: #7b8790;
      font-size: 15px;
      font-weight: 800;
    }

    .future {
      color: #a9b4bc;
      --fill: #f8fafb;
      --text: #5f6d76;
    }

    .done {
      color: #0f766e;
      --fill: #e8f5f2;
      --text: #0b5f59;
    }

    .active {
      color: #b7791f;
      --fill: #fff4d6;
      --text: #76510f;
    }

    .block,
    .pack {
      fill: var(--fill);
      stroke: currentColor;
      stroke-width: 3;
    }

    .pack-line {
      stroke: currentColor;
      stroke-width: 2;
    }

    .wire,
    .control-wire {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3;
    }

    .control-wire {
      stroke-dasharray: 8 7;
    }

    .label,
    .pack-field {
      fill: var(--text);
      font-size: 20px;
      font-weight: 750;
      text-anchor: middle;
    }

    .detail,
    .control-label {
      fill: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 16px;
      font-weight: 650;
      text-anchor: middle;
    }

    .port {
      fill: currentColor;
    }
  </style>

  <defs>
    <g id="base">
      <text class="input-name" x="30" y="20">%a : i8</text>
      <rect class="field sign-field" x="30" y="30" width="40" height="48" />
      <rect class="field exp-field" x="70" y="30" width="100" height="48" />
      <rect class="field frac-field" x="170" y="30" width="80" height="48" />
      <text class="field-label" x="50" y="61">s</text>
      <text class="field-label" x="120" y="61">eeee</text>
      <text class="field-label" x="210" y="61">mmm</text>

      <text class="input-name" x="30" y="100">%b : i8</text>
      <rect class="field sign-field" x="30" y="110" width="40" height="48" />
      <rect class="field exp-field" x="70" y="110" width="100" height="48" />
      <rect class="field frac-field" x="170" y="110" width="80" height="48" />
      <text class="field-label" x="50" y="141">s</text>
      <text class="field-label" x="120" y="141">eeee</text>
      <text class="field-label" x="210" y="141">mmm</text>

      <text class="lane-label" x="292" y="38">SIGN</text>
      <text class="lane-label" x="292" y="190">EXPONENT</text>
      <text class="lane-label" x="292" y="302">SIGNIFICAND</text>
    </g>

    <g id="sign-path">
      <path class="wire" d="M50 78 V88 H310" />
      <path class="wire" d="M50 158 H275 V112 H310" />
      <rect class="block" x="330" y="62" width="120" height="70" />
      <text class="label" x="390" y="92">comb.xor</text>
      <text class="detail" x="390" y="116">%sign : i1</text>
      <path class="wire" d="M450 97 H1235 V220 H1260" />
    </g>

    <g id="exponent-base">
      <path class="wire" d="M120 78 V205 H390" />
      <path class="wire" d="M120 158 V238 H390" />
      <rect class="block" x="410" y="180" width="210" height="90" />
      <text class="label" x="515" y="216">add and remove bias</text>
      <text class="detail" x="515" y="244">%base = ea + eb - 7</text>
      <path class="wire" d="M620 225 H930" />
    </g>

    <g id="exponent-adjust">
      <rect class="block" x="950" y="185" width="200" height="90" />
      <text class="label" x="1050" y="220">exponent adjust</text>
      <text class="detail" x="1050" y="248">%base + zext(%norm)</text>
      <path class="wire" d="M1150 230 H1260 V282" />
    </g>

    <g id="hidden-one">
      <path class="wire" d="M210 78 V342 H310" />
      <path class="wire" d="M210 158 H275 V447 H310" />
      <rect class="block" x="330" y="315" width="160" height="66" />
      <text class="label" x="410" y="343">{1, %fa}</text>
      <text class="detail" x="410" y="367">%ma4 : i4</text>
      <rect class="block" x="330" y="420" width="160" height="66" />
      <text class="label" x="410" y="448">{1, %fb}</text>
      <text class="detail" x="410" y="472">%mb4 : i4</text>
    </g>

    <g id="multiply">
      <path class="wire" d="M490 348 H510" />
      <path class="wire" d="M490 453 H510" />
      <rect class="block" x="530" y="315" width="120" height="66" />
      <text class="label" x="590" y="343">zero extend</text>
      <text class="detail" x="590" y="367">%ma8 : i8</text>
      <rect class="block" x="530" y="420" width="120" height="66" />
      <text class="label" x="590" y="448">zero extend</text>
      <text class="detail" x="590" y="472">%mb8 : i8</text>
      <path class="wire" d="M650 348 H685 V377 H700" />
      <path class="wire" d="M650 453 H685 V423 H700" />
      <rect class="block" x="720" y="350" width="160" height="100" />
      <text class="label" x="800" y="390">comb.mul</text>
      <text class="detail" x="800" y="418">%raw : i8</text>
    </g>

    <g id="normalize">
      <path class="wire" d="M880 400 H930" />
      <rect class="block" x="950" y="335" width="200" height="130" />
      <text class="label" x="1050" y="372">normalization mux</text>
      <text class="detail" x="1050" y="401">%norm = %raw[7]</text>
      <text class="detail" x="1050" y="428">[7:4] or [6:3]</text>
      <text class="detail" x="1050" y="451">%mant : i4</text>
      <path class="control-wire" d="M905 400 V255 H930" />
      <text class="control-label" x="914" y="321">%norm</text>
      <path class="wire" d="M1150 400 H1215 V350 H1260" />
    </g>

    <g id="pack-result">
      <rect class="pack" x="1280" y="190" width="130" height="210" />
      <line class="pack-line" x1="1280" y1="255" x2="1410" y2="255" />
      <line class="pack-line" x1="1280" y1="325" x2="1410" y2="325" />
      <text class="pack-field" x="1345" y="232">sign</text>
      <text class="pack-field" x="1345" y="298">exponent</text>
      <text class="pack-field" x="1345" y="368">fraction</text>
      <path class="wire" d="M1410 295 H1450" />
      <circle class="port" cx="1460" cy="295" r="7" />
      <text class="result-label" x="1415" y="278">%result : i8</text>
    </g>
  </defs>

  <view id="objective" viewBox="0 0 1500 520" preserveAspectRatio="xMidYMid meet" />
  <view id="hidden" viewBox="0 520 1500 520" preserveAspectRatio="xMidYMid meet" />
  <view id="multiply-view" viewBox="0 1040 1500 520" preserveAspectRatio="xMidYMid meet" />
  <view id="normalize-view" viewBox="0 1560 1500 520" preserveAspectRatio="xMidYMid meet" />
  <view id="complete" viewBox="0 2080 1500 520" preserveAspectRatio="xMidYMid meet" />

  <g>
    <use href="#base" />
    <use class="future" href="#sign-path" />
    <use class="future" href="#exponent-base" />
    <use class="future" href="#exponent-adjust" />
    <use class="future" href="#hidden-one" />
    <use class="future" href="#multiply" />
    <use class="future" href="#normalize" />
    <use class="future" href="#pack-result" />
  </g>

  <g transform="translate(0 520)">
    <use href="#base" />
    <use class="future" href="#sign-path" />
    <use class="future" href="#exponent-base" />
    <use class="future" href="#exponent-adjust" />
    <use class="active" href="#hidden-one" />
    <use class="future" href="#multiply" />
    <use class="future" href="#normalize" />
    <use class="future" href="#pack-result" />
  </g>

  <g transform="translate(0 1040)">
    <use href="#base" />
    <use class="future" href="#sign-path" />
    <use class="future" href="#exponent-base" />
    <use class="future" href="#exponent-adjust" />
    <use class="done" href="#hidden-one" />
    <use class="active" href="#multiply" />
    <use class="future" href="#normalize" />
    <use class="future" href="#pack-result" />
  </g>

  <g transform="translate(0 1560)">
    <use href="#base" />
    <use class="future" href="#sign-path" />
    <use class="future" href="#exponent-base" />
    <use class="active" href="#exponent-adjust" />
    <use class="done" href="#hidden-one" />
    <use class="done" href="#multiply" />
    <use class="active" href="#normalize" />
    <use class="future" href="#pack-result" />
  </g>

  <g transform="translate(0 2080)">
    <use href="#base" />
    <use class="done" href="#sign-path" />
    <use class="done" href="#exponent-base" />
    <use class="done" href="#exponent-adjust" />
    <use class="done" href="#hidden-one" />
    <use class="done" href="#multiply" />
    <use class="done" href="#normalize" />
    <use class="active" href="#pack-result" />
  </g>
</svg>
