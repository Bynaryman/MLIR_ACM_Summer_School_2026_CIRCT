<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" role="img" aria-labelledby="title description">
  <title id="title">A six-input lookup table as a 64-bit truth-table memory</title>
  <desc id="description">Six input bits form an address from zero to sixty-three. That address selects one of sixty-four configuration bits as the Boolean output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 4; }
    .memory { fill: #ecf7f5; stroke: #0f766e; stroke-width: 4; }
    .bit { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .selected { fill: #0f766e; stroke: #0f766e; stroke-width: 2; }
    .wire { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
    .label { fill: #111827; font: 750 28px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 600 22px Inter, Arial, sans-serif; text-anchor: middle; }
    .mono { fill: #111827; font: 700 25px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .accent { fill: #0f766e; font: 750 28px Inter, Arial, sans-serif; text-anchor: middle; }
  </style>

  <text class="accent" x="650" y="38">six input bits select one of 2^6 = 64 stored truth-table bits</text>

  <rect class="box" x="65" y="125" width="275" height="245" rx="6"/>
  <text class="label" x="202" y="168">LUT inputs</text>
  <text class="mono" x="202" y="220">x[5:0]</text>
  <text class="small" x="202" y="270">one input combination</text>
  <text class="mono" x="202" y="320">101101</text>

  <line class="wire" x1="340" y1="247" x2="443" y2="247"/>
  <rect class="memory" x="455" y="72" width="455" height="355" rx="6"/>
  <text class="label" x="682" y="112">64 configuration bits</text>
  <g transform="translate(527 142)">
    <rect class="bit" x="0" y="0" width="40" height="28"/><rect class="bit" x="40" y="0" width="40" height="28"/><rect class="bit" x="80" y="0" width="40" height="28"/><rect class="bit" x="120" y="0" width="40" height="28"/><rect class="bit" x="160" y="0" width="40" height="28"/><rect class="bit" x="200" y="0" width="40" height="28"/><rect class="bit" x="240" y="0" width="40" height="28"/><rect class="bit" x="280" y="0" width="40" height="28"/>
    <rect class="bit" x="0" y="28" width="40" height="28"/><rect class="bit" x="40" y="28" width="40" height="28"/><rect class="bit" x="80" y="28" width="40" height="28"/><rect class="bit" x="120" y="28" width="40" height="28"/><rect class="bit" x="160" y="28" width="40" height="28"/><rect class="bit" x="200" y="28" width="40" height="28"/><rect class="bit" x="240" y="28" width="40" height="28"/><rect class="bit" x="280" y="28" width="40" height="28"/>
    <rect class="bit" x="0" y="56" width="40" height="28"/><rect class="bit" x="40" y="56" width="40" height="28"/><rect class="bit" x="80" y="56" width="40" height="28"/><rect class="bit" x="120" y="56" width="40" height="28"/><rect class="bit" x="160" y="56" width="40" height="28"/><rect class="bit" x="200" y="56" width="40" height="28"/><rect class="bit" x="240" y="56" width="40" height="28"/><rect class="bit" x="280" y="56" width="40" height="28"/>
    <rect class="bit" x="0" y="84" width="40" height="28"/><rect class="bit" x="40" y="84" width="40" height="28"/><rect class="bit" x="80" y="84" width="40" height="28"/><rect class="bit" x="120" y="84" width="40" height="28"/><rect class="bit" x="160" y="84" width="40" height="28"/><rect class="bit" x="200" y="84" width="40" height="28"/><rect class="bit" x="240" y="84" width="40" height="28"/><rect class="bit" x="280" y="84" width="40" height="28"/>
    <rect class="bit" x="0" y="112" width="40" height="28"/><rect class="bit" x="40" y="112" width="40" height="28"/><rect class="bit" x="80" y="112" width="40" height="28"/><rect class="bit" x="120" y="112" width="40" height="28"/><rect class="bit" x="160" y="112" width="40" height="28"/><rect class="bit" x="200" y="112" width="40" height="28"/><rect class="bit" x="240" y="112" width="40" height="28"/><rect class="bit" x="280" y="112" width="40" height="28"/>
    <rect class="bit" x="0" y="140" width="40" height="28"/><rect class="bit" x="40" y="140" width="40" height="28"/><rect class="bit" x="80" y="140" width="40" height="28"/><rect class="bit" x="120" y="140" width="40" height="28"/><rect class="bit" x="160" y="140" width="40" height="28"/><rect class="selected" x="200" y="140" width="40" height="28"/><rect class="bit" x="240" y="140" width="40" height="28"/><rect class="bit" x="280" y="140" width="40" height="28"/>
    <rect class="bit" x="0" y="168" width="40" height="28"/><rect class="bit" x="40" y="168" width="40" height="28"/><rect class="bit" x="80" y="168" width="40" height="28"/><rect class="bit" x="120" y="168" width="40" height="28"/><rect class="bit" x="160" y="168" width="40" height="28"/><rect class="bit" x="200" y="168" width="40" height="28"/><rect class="bit" x="240" y="168" width="40" height="28"/><rect class="bit" x="280" y="168" width="40" height="28"/>
    <rect class="bit" x="0" y="196" width="40" height="28"/><rect class="bit" x="40" y="196" width="40" height="28"/><rect class="bit" x="80" y="196" width="40" height="28"/><rect class="bit" x="120" y="196" width="40" height="28"/><rect class="bit" x="160" y="196" width="40" height="28"/><rect class="bit" x="200" y="196" width="40" height="28"/><rect class="bit" x="240" y="196" width="40" height="28"/><rect class="bit" x="280" y="196" width="40" height="28"/>
  </g>
  <text class="small" x="682" y="400">configuration stores the truth table</text>

  <line class="wire" x1="910" y1="247" x2="1012" y2="247"/>
  <rect class="box" x="1025" y="165" width="210" height="165" rx="6"/>
  <text class="label" x="1130" y="215">output</text>
  <text class="mono" x="1130" y="278">y = 1 bit</text>
</svg>
